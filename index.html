<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="box">
    <h1>Expense Tracker</h1>

   
    <form class="expense-form">
    <label for="add expense">add expense </label>
      <input type="text" id="name" placeholder="Lunch" />

      <label for="number">number</label>
      <input type="number" id="amount" placeholder="10" />

      <label for="category">Category</label>
      <select id="category">
       <option value="food">Food</option>
       <option value="travel">Travel</option>
       <option value="category">Category</option>
       <option value="other">Other</option>
      </select>

      <button type="submit">Add Expense</button>
    </form>

    <!-- Total display -->
    <div class="total">
      Total: <strong>$0.00</strong>
    </div>

    <!-- Sample list of expenses -->
    <h2>Expenses</h2>
    <ul class="expense-list">
      <li>
        <span>Lunch (Food)</span>
        <span>$10.00</span>
      </li>
      <li>
        <h2>Bus Ticket (Travel)</h2>
        <h2>lunch food</h2>   
      </li>
    </ul>
  </div>
  <script src="script.js"></script>
</body>

</body>
</html>
